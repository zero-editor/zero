name: release

# Tagging is the release. Nothing builds on a push to main — a dmg is only
# worth making when there's a version to call it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    # arm64. zero is Apple Silicon only, which is also the only thing this
    # builds for — a universal binary would double the download to serve
    # machines the app doesn't claim to run on. macOS 26 rather than an older
    # image because the build now compiles the voice helper against the
    # macOS 26 SDK — SpeechAnalyzer doesn't exist in the ones before it.
    runs-on: macos-26

    # Everything more than one step needs, in the one scope every step shares.
    # The first three aren't secret-shaped — the certificate's name and the two
    # halves of the App Store Connect key that aren't the key itself. The
    # updater's signing key is, and it lives here anyway, because the step that
    # checks a secret is present has to be in the same scope as the step that
    # uses it. Declared on the check step alone, as they were in 0.4.2, the
    # check passes and `tauri build` finds no key: proof of nothing, collected
    # carefully. tauri reads all five from the environment.
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: The tag has to be the version
        # a dmg labelled 0.1.0 cut from tag v0.2.0 is the kind of thing nobody
        # notices for months
        run: |
          tag="${GITHUB_REF_NAME#v}"
          json() { node -e "console.log(JSON.parse(require('fs').readFileSync('$1','utf8')).version)"; }
          v=$(json package.json)
          [ "$v" = "$tag" ] || { echo "::error::package.json says $v, tag says $tag"; exit 1; }
          # and that package.json is still the only copy — a literal version
          # put back here would go stale without anything noticing
          conf=$(json src-tauri/tauri.conf.json)
          [ "$conf" = "../package.json" ] || {
            echo "::error::tauri.conf.json version is '$conf', expected ../package.json"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: rustup toolchain install stable --profile minimal --no-self-update

      - run: npm ci

      # Signing and notarizing are what keep macOS from calling the download
      # damaged. CLAUDE.md says where the secrets come from and when they
      # expire.
      - name: Apple credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -eu
          # Check every one of them before the build rather than during it.
          # tauri treats absent notarization credentials as a warning and signs
          # anyway, so half a configuration doesn't fail — it quietly produces
          # a dmg that only the people downloading it find out about.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 \
                   APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "$(printenv "$v" || true)" ] || { echo "::error::secret $v is missing or empty"; exit 1; }
          done

          # notarytool wants the key as a file on disk, and it's read twice:
          # by tauri for the app, and by the dmg step for the disk image.
          printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/key.p8" >> "$GITHUB_ENV"

          # A keychain of our own holding the certificate. tauri can make its
          # own from APPLE_CERTIFICATE, but it deletes it when the build ends
          # and the dmg still has to be signed after that — so the certificate
          # is imported once, here, and both find it by identity instead.
          kc="$RUNNER_TEMP/build.keychain"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings "$kc"   # no auto-lock partway through
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # without this codesign waits on a keychain prompt no one can answer
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pw" "$kc" >/dev/null
          # and codesign only searches keychains that are on the list
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"

      # CI is set here, and the bundler reads it: it passes --skip-jenkins to
      # bundle_dmg.sh, which skips the Finder-prettifying AppleScript. That
      # script exits 64 when it can't reach Finder, so on a runner with no GUI
      # session it isn't a cosmetic difference, it's the difference between a
      # dmg and a failed build. The cost is a dmg window with no arranged
      # icons. Xcode isn't needed for the icon — it ships compiled — but the
      # voice helper wants swiftc, which the runner image carries.
      - run: npm run tauri build

      - name: Notarize the dmg
        run: |
          set -eu
          # a filename with no version in it, so
          # /releases/latest/download/zero_aarch64.dmg is a link that keeps
          # working across releases — the tagged URL carries the version.
          # Renaming before signing, because the signature covers the file and
          # a rename after stapling is one more thing to get wrong.
          mv "src-tauri/target/release/bundle/dmg/zero_${GITHUB_REF_NAME#v}_aarch64.dmg" \
             zero_aarch64.dmg
          # tauri notarizes and staples the .app and then stops: it signs the
          # disk image around it but never notarizes that, which spctl scores
          # as "Unnotarized Developer ID" — rejected, and the "Apple could not
          # verify it is free of malware" dialog, which is the whole thing
          # we're paying to avoid. Measured on 2.11.4, both halves of it.
          #
          # Signing again is deliberate. It's redundant today, costs a second,
          # and means this step doesn't quietly depend on undocumented bundler
          # behaviour staying put — notarytool refuses an unsigned dmg outright.
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" zero_aarch64.dmg
          xcrun notarytool submit zero_aarch64.dmg --wait \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple zero_aarch64.dmg

      - name: Gatekeeper has to accept it
        run: |
          set -eu
          # what a downloader's Mac is about to do, done here while there's
          # still no release. spctl exits non-zero on rejection, and it rejects
          # a Developer ID signature that isn't notarized — so this is the step
          # that catches a stapling that silently didn't happen.
          spctl -a -t open --context context:primary-signature -vv zero_aarch64.dmg
          app=src-tauri/target/release/bundle/macos/zero.app
          spctl -a -t exec -vv "$app"
          # --deep because the sidecar is nested code: an unsigned or stale
          # zero-voice invalidates the app around it.
          codesign --verify --deep --strict --verbose=2 "$app"

      # The updater installs this tarball, never the dmg, so it earns the same
      # scrutiny the dmg gets above. tauri bundles it last — after it has
      # signed, notarized and stapled the .app — so it should hold the same
      # bundle the disk image does. "Should" is doing work in that sentence:
      # tauri downgrades missing notarization credentials to a warning and
      # bundles anyway, and this is the artifact that installs itself onto a
      # machine with no download prompt in front of it.
      - name: The update has to pass what the download passes
        run: |
          set -eu
          out="$RUNNER_TEMP/updater"
          mkdir -p "$out"
          tar xzf src-tauri/target/release/bundle/macos/zero.app.tar.gz -C "$out"
          xcrun stapler validate "$out/zero.app"
          spctl -a -t exec -vv "$out/zero.app"
          codesign --verify --deep --strict --verbose=2 "$out/zero.app"
          rm -rf "$out"

      - name: The manifest the app polls
        run: |
          set -eu
          cp src-tauri/target/release/bundle/macos/zero.app.tar.gz zero.app.tar.gz
          # The endpoint is /releases/latest/download/latest.json, so this file
          # is always read as the newest release's — but the URL inside it is
          # the tagged one, not another `latest`. A manifest should install the
          # build it was written for, including in the minutes after the next
          # tag when the two disagree about what "latest" means.
          node -e '
            const fs = require("fs");
            const [version, tag, sig] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              notes: `zero ${version}`,
              pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
              platforms: {
                "darwin-aarch64": {
                  signature: fs.readFileSync(sig, "utf8").trim(),
                  url: `https://github.com/zero-editor/zero/releases/download/${tag}/zero.app.tar.gz`,
                },
              },
            }, null, 2) + "\n");
          ' "${GITHUB_REF_NAME#v}" "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/macos/zero.app.tar.gz.sig
          cat latest.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(shasum -a 256 zero_aarch64.dmg | cut -d' ' -f1)
          # the checksum goes in the notes because the Homebrew cask needs it,
          # and this is where it can be read without downloading the file.
          # Four spaces rather than a fence: no backticks to escape twice.
          # What changed is the body of the annotated tag — `npm version -m`
          # writes it — so the release is born with its notes. Writing them
          # afterwards loses a race: an installed copy polls within seconds of
          # publish, fetches the notes then, and shows "no notes for this one".
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          changed=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          notes=$(printf '%s\n' \
            "Apple Silicon. Signed and notarized — it opens without a warning." \
            "" \
            "    sha256  $sha")
          if [ -n "$changed" ]; then
            notes=$(printf '%s\n' "$notes" "" "## What's Changed" "" "$changed")
          fi
          # --notes is prepended to the changelog --generate-notes writes
          # the tarball and the manifest are the updater's half of the release:
          # the dmg is what a new user downloads, these are what an installed
          # copy reads and installs without one
          gh release create "$GITHUB_REF_NAME" zero_aarch64.dmg zero.app.tar.gz latest.json \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "$notes"

      # The runner is thrown away either way. This is for the run that fails
      # halfway and leaves a certificate sitting in an unlocked keychain.
      - name: Forget the certificate
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/key.p8"

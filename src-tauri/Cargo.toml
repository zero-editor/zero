[package]
name = "zero"
# Not the app's version, and deliberately a number nobody could mistake for it:
# tauri.conf.json reads that from package.json, so this crate's is unused and
# would only be a third copy to forget to bump.
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# macOS 26 Liquid Glass behind the webview; safe no-op everywhere else
tauri-plugin-liquid-glass = "0.1"
vt100 = "0.16.2"

# Already in the tree: tauri-plugin-updater depends on the same reqwest 0.13
# and supplies the rustls stack (ring, via `rustls-no-provider`). Asking for
# a TLS feature here would pull a *second* crypto backend — aws-lc-sys, plus
# quinn for an HTTP/3 nothing uses — so this asks only for `json` and shares
# what is already compiled.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# reqwest above is built `rustls-no-provider`, which is a *runtime* contract:
# the client panics on construction unless a crypto provider was installed
# first. Naming rustls here is what lets `linear.rs` install ring's — see the
# `wire` test, which is the only thing that catches getting this wrong.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# WKWebView renders at 60fps even on a 120Hz ProMotion panel; unlocking it
# means talking to WebKit's private feature flags directly (see high_refresh.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSRect/NSPoint, for moving the traffic lights onto the top bar's axis
# (traffic_lights.rs). Already in the tree — tao and wry build it — so this
# only names it.
objc2-core-foundation = { version = "0.3", features = ["objc2"] }
# the ObjC block the frame-change observer is registered with, same story
block2 = "0.6"

